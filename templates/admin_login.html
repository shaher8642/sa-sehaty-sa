<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة | صحة</title>
    <link rel="icon" href="{{ url_for('static', filename='inquiry/seha.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2b5ea7 0%, #1e3d6f 100%);
            direction: rtl;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 100px; height: 100px;
            background: #2b5ea7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 50px;
            font-weight: bold;
        }
        h1 {
            color: #2b5ea7;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            color: #334155;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.2s;
            text-align: right;
        }
        input:focus {
            outline: none;
            border-color: #2b5ea7;
        }
        .btn {
            width: 100%;
            background: #2b5ea7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #1e3d6f; }
        .alert {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .hint {
            margin-top: 24px;
            padding: 14px;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #0369a1;
            text-align: right;
        }
        .hint strong { color: #075985; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2b5ea7;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">✚</div>
        <h1>بوابة الإدارة</h1>
        <p class="subtitle">منصة صحة — منطقة الإدارة</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autofocus placeholder="اسم المستخدم">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required placeholder="•••••••">
            </div>
            <button type="submit" class="btn">تسجيل الدخول</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← العودة للصفحة الرئيسية</a>
    </div>
</body>
</html>
